
esphome:
  name: esp32-ha
  friendly_name: Esp32-HA

# -------------------------------------------------------------------
# ESP32 board configuration
# -------------------------------------------------------------------
esp32:
  board: lolin_s2_mini
  framework:
      type: esp-idf

# Enable PSRAM (required for displays / fonts / graphics buffers)
psram:

# -------------------------------------------------------------------
# Core services
# -------------------------------------------------------------------

# Enable logging over serial and OTA
logger:

# Enable Home Assistant native API (encrypted)
api:
  encryption:
    key: "xgcyGAd2c70vNjK/c3SUVVwEExm+w6EvypwavQOfDgA="

# Enable Over-The-Air updates
ota:
  - platform: esphome
    password: "cc591d722df7082174631b5b37661898"

# -------------------------------------------------------------------
# WiFi configuration
# -------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback access point if WiFi fails
  ap:
    ssid: "Esp32-Ha Fallback Hotspot"
    password: "J4X2Dy290fbt"

# Captive portal for fallback AP
captive_portal:

# -------------------------------------------------------------------
# Fonts (downloaded from Google Fonts)
# -------------------------------------------------------------------
font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto_reg
    size: 18
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_2
    size: 36

# -------------------------------------------------------------------
# SPI bus for TFT display
# -------------------------------------------------------------------
spi:
  - id: bus_display
    clk_pin: GPIO7
    mosi_pin: GPIO11

  - id: bus_touch
    clk_pin: GPIO12  # Versetzt auf freien Pin
    mosi_pin: GPIO13 # Versetzt auf freien Pin
    miso_pin: GPIO9
    

  # interface: hardware  # optional, auto-selected on ESP32

# -------------------------------------------------------------------
# Backlight PWM output
# -------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO39
    id: backlight_pwm

# Backlight as a dimmable monochromatic light
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# -------------------------------------------------------------------
# Custom colors for display rendering
# -------------------------------------------------------------------
substitutions:
 # Colors common
  color_white: "0xFFFFFF"
  color_grey: "0xa5a5a5"
  color_dark_grey: "0x282828"
  color_darker_grey: "0x212121"
  color_light_grey: "0x444444"
  color_accent: "0x18bcf2"
  color_warning: "0xd2691e"
  color_success: "0x7fff00"
  # Mode colors
  color_auto: "0x2fd1c5"
  color_cool: "0x00bfff"
  color_heat: "0xff1493"
  color_dry: "0xff8c00"
  color_fan: "0x87ceeb"
  # Temperature colors
  color_temp_current: "0x35ffe6"
  color_temp_set: "0x51a0e4"
  color_temp_ticks: "0x585858"


color:
  - id: my_red
    red: 100%
    green: 3%
    blue: 5%

  - id: black
    red: 0%
    green: 0%
    blue: 0%


# -------------------------------------------------------------------
# Home Assistant entity imports
# -------------------------------------------------------------------
#number:
  # Actual room temperature (sensor)
 # - platform: homeassistant
 ##   id: wohnzimmer_temp
 #   entity_id: sensor.temperaturesensor_28_2167_36f3_781e
 #   internal: true

  # Thermostat target temperature
 # - platform: homeassistant
 #   id: buderus_temp
 #   entity_id: number.thermostat_hc1_selected_room_temperature
 #   internal: true

binary_sensor:
  - platform: homeassistant
    id: ha_sc_homeoffice
    entity_id: switch.neue_szene_stateful_scene
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: btn_homeoffice
          state:
            checked: !lambda return x;



# -------------------------------------------------------------------
# Display configuration (ILI9341 TFT)
# -------------------------------------------------------------------
display:
  - platform: ili9xxx
    spi_id: bus_display
    model: ILI9341
    invert_colors: false

    cs_pin: GPIO33
    dc_pin: GPIO14
    reset_pin: GPIO21

# -------------------------------------------------------------------
# Touchscreen configuration (XPT2046 Touch Screen Controller)
# -------------------------------------------------------------------
touchscreen:
  id: my_touchscreen
  platform: xpt2046
  spi_id: bus_touch
  cs_pin: GPIO5
  interrupt_pin: GPIO3
  update_interval: 50ms
  threshold: 400
  transform:
    mirror_x: true
  calibration:
    x_min: 280
    x_max: 3860
    y_min: 340
    y_max: 3860

# -------------------------------------------------------------------
# LGL
# -------------------------------------------------------------------
lvgl:
  pages:
    - id: room_page
      widgets:
        - button:
            id: btn_homeoffice
            x: 20  # Leftmost position
            y: 20
            #styles: style_mode_button
            widgets:
              - label:
                  #styles: style_menu_button
                  text: "Homeoffice"
                  text_color: ${color_white}
                  #checkable: true




