
esphome:
  name: esp32-ha
  friendly_name: Esp32-HA

# -------------------------------------------------------------------
# ESP32 board configuration
# -------------------------------------------------------------------
esp32:
  board: lolin_s2_mini
  framework:
      type: esp-idf

# Enable PSRAM (required for displays / fonts / graphics buffers)
psram:

# -------------------------------------------------------------------
# Core services
# -------------------------------------------------------------------

# Enable logging over serial and OTA
logger:

# Enable Home Assistant native API (encrypted)
api:
  encryption:
    key: "xgcyGAd2c70vNjK/c3SUVVwEExm+w6EvypwavQOfDgA="

# Enable Over-The-Air updates
ota:
  - platform: esphome
    password: "cc591d722df7082174631b5b37661898"

# -------------------------------------------------------------------
# WiFi configuration
# -------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback access point if WiFi fails
  ap:
    ssid: "Esp32-Ha Fallback Hotspot"
    password: "J4X2Dy290fbt"

# Captive portal for fallback AP
captive_portal:

# -------------------------------------------------------------------
# Fonts (downloaded from Google Fonts)
# -------------------------------------------------------------------
font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto_reg
    size: 34
    bpp: 4


# -------------------------------------------------------------------
# SPI bus for TFT display
# -------------------------------------------------------------------
spi:
  - id: bus_display
    clk_pin: GPIO7
    mosi_pin: GPIO11

# -------------------------------------------------------------------
# Backlight PWM output
# -------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO39
    id: backlight_pwm

# Backlight as a dimmable monochromatic light
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON


# -------------------------------------------------------------------
# Rotary Encoder input (GPIO 15, 16, 17) - Manual implementation
# -------------------------------------------------------------------

sensor:
  - platform: rotary_encoder
    name: "Rotary Encoder"
    filters:
      debounce: 30ms
    pin_a: 
      number: GPIO40
      mode: INPUT_PULLUP
      inverted: true
    pin_b: 
      number: GPIO38
      mode: INPUT_PULLUP
      inverted: true
    on_clockwise:
      - display_menu.up: rotary_menu
    on_anticlockwise:
      - display_menu.down: rotary_menu


binary_sensor:


  # Rotary encoder button (SW)
  - platform: gpio
    pin:
      number: GPIO37
      mode: INPUT_PULLUP
      inverted: true
    id: encoder_button
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_click:
      then:
        - display_menu.enter: rotary_menu

  # Home Assistant switch status imports
  - platform: homeassistant
    id: ha_anwesenheit
    entity_id: switch.anwesenheit
    on_state:
      then:
        - lambda: |-
            id(switch_anwesenheit).publish_state(x);
  - platform: homeassistant
    id: ha_fernseher
    entity_id: switch.wozi_anlage_1
    on_state:
      then:
        - lambda: |-
            id(switch_fernseher).publish_state(x);
  - platform: homeassistant
    id: ha_babysitter
    entity_id: input_boolean.babysitter
    on_state:
      then:
        - lambda: |-
            id(switch_babysitter).publish_state(x);

switch:
  - platform: template
    id: switch_anwesenheit
    optimistic: true
    on_turn_on:
      - homeassistant.action:
          action: switch.turn_on
          data:
            entity_id: switch.anwesenheit
    on_turn_off:
      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.anwesenheit
  - platform: template
    id: switch_fernseher
    optimistic: true
    on_turn_on:
      - homeassistant.action:
          action: switch.turn_on
          data:
            entity_id: switch.wozi_anlage_1
    on_turn_off:
      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.wozi_anlage_1
  - platform: template
    id: switch_babysitter
    optimistic: true
    on_turn_on:
      - homeassistant.action:
          action: input_boolean.turn_on
          data:
            entity_id: input_boolean.babysitter
    on_turn_off:
      - homeassistant.action:
          action: input_boolean.turn_off
          data:
            entity_id: input_boolean.babysitter
# -------------------------------------------------------------------
# Display configuration (ILI9341 TFT)
# -------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: my_display
    spi_id: bus_display
    model: ILI9341
    invert_colors: false

    cs_pin: GPIO33
    dc_pin: GPIO14 # War vorher GPIO34
    reset_pin: GPIO21
    lambda: |-
      it.menu(0, 0, id(rotary_menu), it.get_width(), it.get_height());



# -------------------------------------------------------------------
# Graphical Display Menu
# -------------------------------------------------------------------
graphical_display_menu:
  - id: rotary_menu
    display: my_display
    font: roboto_reg
    active: true
    mode: rotary
    items:
 #     - type: switch
 #       immediate_edit: true
 #       text: "Anwesenheit"
 #       switch: switch_anwesenheit
      - type: switch
        immediate_edit: true
        text: "Fernseher"
        switch: switch_fernseher
      - type: switch  
        immediate_edit: true  
        text: "Babysitter"
        switch: switch_babysitter




