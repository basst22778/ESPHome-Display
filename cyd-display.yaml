
esphome:
  name: cyd
  on_boot:
    - priority: -100
      then:
        - script.execute: wake_display
        - script.execute: sync_ui

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

# Setup WiFi credentials
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - script.execute: sync_ui


color:
  - id: bg_color
    hex: "000000"
  - id: grid_color
    hex: 2A2A2A
  - id: icon_inactive
    hex: B8B8B8
  - id: accent_on
    hex: "000000"
  - id: icon_active
    hex: "000000"
  - id: tile_active_bg
    hex: 555555
  - id: status_text
    hex: D8D8D8
  - id: status_icon_white
    hex: "FFFFFF"

font:
  - file:
      type: gfonts
      family: Roboto
    id: status_font
    size: 14
    bpp: 4
  - file:
      type: gfonts
      family: Roboto Mono
    id: time_font
    size: 14
    bpp: 4
image:
  - file: mdi:home-account
    id: icon_anwesenheit
    type: grayscale
    transparency: alpha_channel
    resize: 20x20
  - file: mdi:home-export-outline
    id: icon_anwesenheit_away
    type: grayscale
    transparency: alpha_channel
    resize: 20x20
  - file: mdi:thermometer
    id: icon_temperature
    type: grayscale
    transparency: alpha_channel
    resize: 20x20
  - file: mdi:clock-outline
    id: icon_clock
    type: grayscale
    transparency: alpha_channel
    resize: 20x20
  - file: mdi:lightbulb-multiple-outline
    id: icon_hintergrundlicht
    type: grayscale
    transparency: alpha_channel
    resize: 48x48
  - file: mdi:baby-carriage
    id: icon_babysitter
    type: grayscale
    transparency: alpha_channel
    resize: 48x48
  - file: mdi:speaker
    id: icon_anlage
    type: grayscale
    transparency: alpha_channel
    resize: 48x48
  - file: mdi:ceiling-light
    id: icon_deckenlampe
    type: grayscale
    transparency: alpha_channel
    resize: 48x48
  - file: mdi:floor-lamp
    id: icon_stehlampe
    type: grayscale
    transparency: alpha_channel
    resize: 48x48
  - file: mdi:lamp
    id: icon_tischlampe
    type: grayscale
    transparency: alpha_channel
    resize: 48x48

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: my_display
    color_order: RGB
    model: ILI9341
    spi_id: tft
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    auto_clear_enabled: false
    invert_colors: false
    color_depth: 16BIT
    update_interval: never
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    dimensions:
      width: 240

      height: 320

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - script.execute: sync_ui

sensor:
  - platform: homeassistant
    id: thermostat_temperature
    entity_id: climate.thermostat_hc1
    attribute: current_temperature
    on_value:
      then:
        - script.execute: sync_ui

interval:
  - interval: 30s
    then:
      - script.execute: sync_ui

binary_sensor:
  - platform: homeassistant
    id: ha_anwesenheit
    entity_id: input_boolean.anwesenheit
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.label.update:
                  id: status_presence
                  text: "HOME"
              - lvgl.image.update:
                  id: status_icon_anwesenheit
                  src: icon_anwesenheit
                  image_recolor: status_icon_white
                  image_recolor_opa: 100%
            else:
              - lvgl.label.update:
                  id: status_presence
                  text: "AWAY"
              - lvgl.image.update:
                  id: status_icon_anwesenheit
                  src: icon_anwesenheit_away
                  image_recolor: status_icon_white
                  image_recolor_opa: 100%

switch:
  - platform: homeassistant
    id: ha_hintergrundlicht
    entity_id: switch.hintergrundlicht_stateful_scene
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.widget.update:
                  id: tile_hintergrundlicht
                  bg_color: tile_active_bg
              - lvgl.image.update:
                  id: tile_icon_hintergrundlicht
                  image_recolor: icon_active
                  image_recolor_opa: 100%
            else:
              - lvgl.widget.update:
                  id: tile_hintergrundlicht
                  bg_color: bg_color
              - lvgl.image.update:
                  id: tile_icon_hintergrundlicht
                  image_recolor: icon_inactive
                  image_recolor_opa: 100%
  - platform: homeassistant
    id: ha_babysitter
