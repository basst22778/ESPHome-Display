                  id: tile_babysitter
                  bg_color: tile_active_bg
              - lvgl.image.update:
                  id: tile_icon_babysitter
                  image_recolor: icon_active
                  image_recolor_opa: 100%
            else:
              - lvgl.widget.update:
                  id: tile_babysitter
                  bg_color: bg_color
              - lvgl.image.update:
                  id: tile_icon_babysitter
                  image_recolor: icon_inactive
                  image_recolor_opa: 100%
  - platform: homeassistant
    id: ha_anlage
    entity_id: switch.wozi_anlage_1
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.widget.update:
                  id: tile_anlage
                  bg_color: tile_active_bg
              - lvgl.image.update:
                  id: tile_icon_anlage
                  image_recolor: icon_active
                  image_recolor_opa: 100%
            else:
              - lvgl.widget.update:
                  id: tile_anlage
                  bg_color: bg_color
              - lvgl.image.update:
                  id: tile_icon_anlage
                  image_recolor: icon_inactive
                  image_recolor_opa: 100%
  - platform: homeassistant
    id: ha_deckenlampe
    entity_id: switch.wozi_schalter_wozi_deckenlampe
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.widget.update:
                  id: tile_deckenlampe
                  bg_color: tile_active_bg
              - lvgl.image.update:
                  id: tile_icon_deckenlampe
                  image_recolor: icon_active
                  image_recolor_opa: 100%
            else:
              - lvgl.widget.update:
                  id: tile_deckenlampe
                  bg_color: bg_color
              - lvgl.image.update:
                  id: tile_icon_deckenlampe
                  image_recolor: icon_inactive
                  image_recolor_opa: 100%
  - platform: homeassistant
    id: ha_stehlampe
    entity_id: switch.wohnzimmer_stehlampe
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.widget.update:
                  id: tile_stehlampe
                  bg_color: tile_active_bg
              - lvgl.image.update:
                  id: tile_icon_stehlampe
                  image_recolor: icon_active
                  image_recolor_opa: 100%
            else:
              - lvgl.widget.update:
                  id: tile_stehlampe
                  bg_color: bg_color
              - lvgl.image.update:
                  id: tile_icon_stehlampe
                  image_recolor: icon_inactive
                  image_recolor_opa: 100%
  - platform: homeassistant
    id: ha_tischlampe
    entity_id: light.wozi_tischlampe_2
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.widget.update:
                  id: tile_tischlampe
                  bg_color: tile_active_bg
              - lvgl.image.update:
                  id: tile_icon_tischlampe
                  image_recolor: icon_active
                  image_recolor_opa: 100%
            else:
              - lvgl.widget.update:
                  id: tile_tischlampe
                  bg_color: bg_color
              - lvgl.image.update:
                  id: tile_icon_tischlampe
                  image_recolor: icon_inactive
                  image_recolor_opa: 100%

script:
  - id: wake_display
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 90%
      - delay: 2min
      - light.turn_on:
          id: backlight
          brightness: 25%
  - id: sync_ui
    then:
      - lvgl.label.update:
          id: status_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: status_temp
          text: !lambda |-
            if (isnan(id(thermostat_temperature).state)) return std::string("--.-C");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1fC", id(thermostat_temperature).state);
            return std::string(buf);
      - if:
          condition:
            binary_sensor.is_on: ha_anwesenheit
          then:
            - lvgl.label.update:
                id: status_presence
                text: "HOME"
            - lvgl.image.update:
                id: status_icon_anwesenheit
                src: icon_anwesenheit
                image_recolor: status_icon_white
                image_recolor_opa: 100%
          else:
            - lvgl.label.update:
                id: status_presence
                text: "AWAY"
            - lvgl.image.update:
                id: status_icon_anwesenheit
                src: icon_anwesenheit_away
                image_recolor: status_icon_white
                image_recolor_opa: 100%
      - if:
          condition:
            switch.is_on: ha_hintergrundlicht
          then:
            - lvgl.widget.update:
                id: tile_hintergrundlicht
                bg_color: tile_active_bg
            - lvgl.image.update:
                id: tile_icon_hintergrundlicht
                image_recolor: icon_active
                image_recolor_opa: 100%
          else:
            - lvgl.widget.update:
                id: tile_hintergrundlicht
                bg_color: bg_color
            - lvgl.image.update:
                id: tile_icon_hintergrundlicht
                image_recolor: icon_inactive
                image_recolor_opa: 100%
      - if:
          condition:
            switch.is_on: ha_babysitter
          then:
            - lvgl.widget.update:
                id: tile_babysitter
                bg_color: tile_active_bg
            - lvgl.image.update:
                id: tile_icon_babysitter
                image_recolor: icon_active
                image_recolor_opa: 100%
          else:
            - lvgl.widget.update:
                id: tile_babysitter
                bg_color: bg_color
            - lvgl.image.update:
                id: tile_icon_babysitter
                image_recolor: icon_inactive
                image_recolor_opa: 100%
      - if:
          condition:
            switch.is_on: ha_anlage
          then:
            - lvgl.widget.update:
                id: tile_anlage
                bg_color: tile_active_bg
            - lvgl.image.update:
                id: tile_icon_anlage
                image_recolor: icon_active
                image_recolor_opa: 100%
          else:
            - lvgl.widget.update:
                id: tile_anlage
                bg_color: bg_color
            - lvgl.image.update:
                id: tile_icon_anlage
                image_recolor: icon_inactive
                image_recolor_opa: 100%
      - if:
          condition:
            switch.is_on: ha_deckenlampe
          then:
            - lvgl.widget.update:
                id: tile_deckenlampe
                bg_color: tile_active_bg
            - lvgl.image.update:
                id: tile_icon_deckenlampe
                image_recolor: icon_active
                image_recolor_opa: 100%
          else:
            - lvgl.widget.update:
                id: tile_deckenlampe
                bg_color: bg_color
            - lvgl.image.update:
                id: tile_icon_deckenlampe
                image_recolor: icon_inactive
                image_recolor_opa: 100%
      - if:
          condition:
            switch.is_on: ha_stehlampe
          then:
            - lvgl.widget.update:
                id: tile_stehlampe
                bg_color: tile_active_bg
            - lvgl.image.update:
                id: tile_icon_stehlampe
                image_recolor: icon_active
                image_recolor_opa: 100%
          else:
            - lvgl.widget.update:
                id: tile_stehlampe
                bg_color: bg_color
            - lvgl.image.update:
                id: tile_icon_stehlampe
                image_recolor: icon_inactive
                image_recolor_opa: 100%
      - if:
          condition:
            switch.is_on: ha_tischlampe
          then:
            - lvgl.widget.update:
                id: tile_tischlampe
                bg_color: tile_active_bg
            - lvgl.image.update:
                id: tile_icon_tischlampe
                image_recolor: icon_active
                image_recolor_opa: 100%
          else:
            - lvgl.widget.update:
                id: tile_tischlampe
                bg_color: bg_color
            - lvgl.image.update:
                id: tile_icon_tischlampe
                image_recolor: icon_inactive
                image_recolor_opa: 100%

lvgl:
  displays:
    - my_display
  rotation: 180
  touchscreens:
    - touchscreen_id: my_touchscreen
  bg_color: bg_color
  widgets:
    - obj:
        x: 0
        y: 0
        width: 240
        height: 320
        bg_color: bg_color
        border_width: 0
        pad_all: 0
        radius: 0
        scrollbar_mode: "OFF"
        widgets:
          - obj:
              x: 0
              y: 0
              width: 240
              height: 44
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              widgets:
                - image:
                    id: status_icon_anwesenheit
                    src: icon_anwesenheit
                    x: 10
                    y: 12
                    image_recolor: status_icon_white
                    image_recolor_opa: 100%
                - label:
                    id: status_presence
                    x: 34
                    y: 12
                    text: "HOME"
                    text_font: status_font
                    text_color: status_text
                - image:
                    id: status_icon_temp
                    src: icon_temperature
                    x: 86
                    y: 12
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
                - label:
                    id: status_temp
                    x: 110
                    y: 12
                    text: "--.-C"
                    text_font: status_font
                    text_color: status_text
                - image:
                    id: status_icon_clock
                    src: icon_clock
                    x: 166
                    y: 11
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
                - label:
                    id: status_time
                    x: 190
                    y: 12
                    text: "--:--"
                    text_font: time_font
                    text_color: status_text
          - obj:
              id: tile_hintergrundlicht
              x: 0
              y: 43
              width: 120
              height: 92
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              on_click:
                then:
                  - switch.toggle: ha_hintergrundlicht
              widgets:
                - image:
                    id: tile_icon_hintergrundlicht
                    src: icon_hintergrundlicht
                    align: CENTER
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
          - obj:
              id: tile_babysitter
              x: 119
              y: 43
              width: 121
              height: 92
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              on_click:
                then:
                  - switch.toggle: ha_babysitter
              widgets:
                - image:
                    id: tile_icon_babysitter
                    src: icon_babysitter
                    align: CENTER
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
          - obj:
              id: tile_anlage
              x: 0
              y: 134
              width: 120
              height: 93
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              on_click:
                then:
                  - switch.toggle: ha_anlage
              widgets:
                - image:
                    id: tile_icon_anlage
                    src: icon_anlage
                    align: CENTER
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
          - obj:
              id: tile_deckenlampe
              x: 119
              y: 134
              width: 121
              height: 93
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              on_click:
                then:
                  - switch.toggle: ha_deckenlampe
              widgets:
                - image:
                    id: tile_icon_deckenlampe
                    src: icon_deckenlampe
                    align: CENTER
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
          - obj:
              id: tile_stehlampe
              x: 0
              y: 226
              width: 120
              height: 94
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              on_click:
                then:
                  - switch.toggle: ha_stehlampe
              widgets:
                - image:
                    id: tile_icon_stehlampe
                    src: icon_stehlampe
                    align: CENTER
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%
          - obj:
              id: tile_tischlampe
              x: 119
              y: 226
              width: 121
              height: 94
              bg_color: bg_color
              border_width: 1
              border_color: grid_color
              radius: 0
              pad_all: 0
              on_click:
                then:
                  - switch.toggle: ha_tischlampe
              widgets:
                - image:
                    id: tile_icon_tischlampe
                    src: icon_tischlampe
                    align: CENTER
                    image_recolor: icon_inactive
                    image_recolor_opa: 100%

touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  calibration:
    x_min: 208
    x_max: 3823
    y_min: 282
    y_max: 3835
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: true
  on_touch:
    then:
      - script.execute: wake_display
